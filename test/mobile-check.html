<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SD-10 mobile layout check</title>
  <style>
    body { margin: 0; font: 12px ui-monospace, monospace; display: flex; gap: 16px; align-items: flex-start; }
    iframe { border: 1px solid #888; width: 375px; height: 2600px; flex: none; }
    #out { white-space: pre-wrap; max-width: 560px; padding: 8px; }
  </style>
</head>
<body>
  <iframe id="app" src="../index.html?demo"></iframe>
  <pre id="out">running…</pre>
  <script type="module">
    const out = document.getElementById('out');
    const frame = document.getElementById('app');
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    async function until(fn, ms = 15000) { const t = Date.now(); while (Date.now() - t < ms) { if (fn()) return true; await sleep(50); } return false; }
    const lines = [];

    function audit(label) {
      const d = frame.contentDocument, w = frame.contentWindow;
      const vw = d.documentElement.clientWidth;
      const sw = d.documentElement.scrollWidth;
      lines.push(`${sw > vw ? 'FAIL' : 'PASS'} ${label}: viewport ${vw}px, document ${sw}px`);
      if (sw > vw) {
        const offenders = [...d.body.querySelectorAll('*')]
          .filter((el) => el.getBoundingClientRect().right > vw + 1 && el.getBoundingClientRect().width > 0)
          .filter((el) => ![...el.children].some((c) => c.getBoundingClientRect().right > vw + 1)) // innermost only
          .slice(0, 12)
          .map((el) => `   ${el.tagName.toLowerCase()}${el.id ? '#' + el.id : ''}.${[...el.classList].slice(0, 4).join('.')} right=${Math.round(el.getBoundingClientRect().right)}`);
        lines.push(...offenders);
      }
      out.textContent = lines.join('\n');
    }

    frame.onload = async () => {
      const d = frame.contentDocument, $ = (id) => d.getElementById(id);
      try { frame.contentWindow.localStorage.clear(); } catch {}
      await sleep(300);
      audit('disconnected');
      $('btnConnect').click();
      await until(() => /simulated/.test($('connPill').textContent) && $('setName').value);
      $('demoShutter').click(); await until(() => $('btnMeasure').textContent === 'Calibrate');
      $('btnMeasure').click(); await until(() => /Calibrated/.test($('statusChips').textContent) && !$('btnMeasure').disabled);
      $('demoShutter').click(); await until(() => $('btnMeasure').textContent === 'Measure' && !$('btnMeasure').disabled);
      // Compare tab with no reference: the measurement becomes the reference.
      d.querySelector('[data-mode=compare]').click();
      const hintOk = /will become the reference/.test($('measureHint').textContent);
      $('btnMeasure').click();
      const capOk = await until(() => /Reference captured/.test($('toast').textContent) && !$('btnMeasure').disabled);
      lines.push(`${hintOk && capOk ? 'PASS' : 'FAIL'} compare with no reference captures one (${$('toast').textContent})`);
      $('btnMeasure').click();
      const cmpOk = await until(() => /PASS|FAIL/.test($('verdict').textContent) && !$('btnMeasure').disabled);
      lines.push(`${cmpOk ? 'PASS' : 'FAIL'} next measurement is compared (${$('verdict').textContent.replace(/\s+/g, ' ').trim()})`);
      // Pick a different history row as reference: the sample on screen must be re-compared against it.
      $('demoSample').value = 'Sky blue'; $('demoSample').dispatchEvent(new Event('change'));
      $('btnMeasure').click();
      await until(() => /PASS|FAIL/.test($('verdict').textContent) && !$('btnMeasure').disabled && d.querySelectorAll('#histBody tr').length === 3);
      const sampleHex = $('swatch').title;
      const before = $('verdict').textContent.replace(/\s+/g, ' ').trim();
      d.querySelectorAll('#histBody tr')[1].querySelector('[data-act=ref]').click();   // previous sample becomes reference
      const reOk = await until(() => /compared against it/.test($('toast').textContent));
      const after = $('verdict').textContent.replace(/\s+/g, ' ').trim();
      const refRow = d.querySelectorAll('#histBody tr')[1].textContent.includes('REF');
      lines.push(`${reOk && $('swatch').title === sampleHex && after !== before && /PASS|FAIL/.test(after) && refRow ? 'PASS' : 'FAIL'} history "ref" re-compares the current sample (${before} -> ${after}, REF badge ${refRow})`);
      const res = frame.contentWindow.performance.getEntriesByType('resource').map((e) => e.name).filter((n) => /\/js\//.test(n));
      const versioned = res.length >= 8 && res.every((n) => /\?v=/.test(n));
      lines.push(`${versioned ? 'PASS' : 'FAIL'} all ${res.length} app modules loaded with ?v= cache-busting`);
      d.querySelector('[data-mode=spot]').click();
      $('btnMeasure').click(); await until(() => !$('resultArea').classList.contains('hidden') && !$('btnMeasure').disabled);
      d.querySelector('[data-mode=line]').click();
      $('btnMeasure').click(); await until(() => !$('strip').classList.contains('hidden') && !$('btnMeasure').disabled);
      $('btnSetRef').click();
      d.querySelector('[data-mode=compare]').click();
      $('demoSample').value = 'Sunflower'; $('demoSample').dispatchEvent(new Event('change'));
      $('btnMeasure').click(); await until(() => /PASS|FAIL/.test($('verdict').textContent) && !$('btnMeasure').disabled);
      await sleep(1500);
      audit('connected with results');
      document.title = lines.some((l) => l.startsWith('FAIL')) ? 'FAILURES' : 'ALL PASS';
    };
  </script>
</body>
</html>
