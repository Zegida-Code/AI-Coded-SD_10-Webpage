<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SD-10 print match smoke test</title>
  <style>
    body { margin: 0; font: 12px ui-monospace, monospace; display: flex; gap: 12px; align-items: flex-start; }
    iframe { border: 0; width: 900px; height: 2600px; flex: none; }
    #out { white-space: pre-wrap; padding: 8px; max-width: 600px; }
  </style>
</head>
<body>
  <iframe id="app" src="../index.html?demo#match"></iframe>
  <pre id="out">running…</pre>
  <script type="module">
    import { printSpectrum } from '../js/printer-sim.js';
    import { spectrumToLab } from '../js/color.js';
    const out = document.getElementById('out');
    const lines = [];
    const log = (ok, msg) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${msg}`); out.textContent = lines.join('\n'); };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    async function until(fn, ms = 30000) { const t = Date.now(); while (Date.now() - t < ms) { if (fn()) return true; await sleep(50); } return false; }
    const frame = document.getElementById('app');

    frame.onload = async () => {
      const w = frame.contentWindow, d = frame.contentDocument, $ = (id) => d.getElementById(id);
      const errors = [];
      w.addEventListener('error', (e) => errors.push(e.message));
      w.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
      try { w.localStorage.clear(); } catch {}
      w.confirm = () => true;
      const files = [];
      w.HTMLAnchorElement.prototype.click = function () { files.push({ name: this.download, href: this.href }); };
      const downloads = () => files.filter((f) => f.name?.endsWith('.pdf')).length;
      const readFile = async (f) => (await fetch(f.href)).text();
      const state_busy = () => /…$/.test($('btnMatchMeasure').textContent);
      const setSel = (id, v) => { $(id).value = v; $(id).dispatchEvent(new Event('change')); };

      log(!$('viewMatch').classList.contains('hidden') && $('viewConsole').classList.contains('hidden'), '#match opens the Print match view');
      log($('mMode').value === 'spot' && $('mDesign').value === 'full' && $('mPaper').value === 'custom' && $('mMediaW').value === '210' && $('mMediaH').value === '297' && d.querySelectorAll('#mColorList li[data-color]').length === 1,
        'defaults: spot color sheets, 16 patches, custom media 210 × 297 mm, one color');
      setSel('mPaper', 'letter');
      const letterOk = $('mMediaW').value === '215.9' && $('mMediaH').value === '279.4';
      $('mMediaW').value = '700'; $('mMediaW').dispatchEvent(new Event('input'));
      const switched = $('mPaper').value === 'custom';
      $('mMediaW').dispatchEvent(new Event('change'));
      log(letterOk && switched && /at 700 mm wide/.test($('mCustomHint').textContent), `a preset fills in its size; editing it switches to custom (${$('mCustomHint').textContent})`);
      // the height box cannot go below one row of patches plus the sheet's text
      $('mMediaH').value = '10'; $('mMediaH').dispatchEvent(new Event('change'));
      const minH = +$('mMediaH').min;
      log(minH > 20 && +$('mMediaH').value === minH && /Height raised to/.test($('toast').textContent) && /Minimum height \d+ mm/.test($('mCustomHint').textContent),
        `height box minimum follows the patches and text (${minH} mm at 700 mm wide)`);
      setSel('mPatchMm', '30');
      log(+$('mMediaH').value > minH && /Height raised to \d+ mm \(was \d+ mm\)/.test($('toast').textContent), `larger patches raise the height automatically and say so (${$('mMediaH').value} mm)`);
      setSel('mPatchMm', '20');
      // save a size under a name, pick it again from the list, remove it
      $('mMediaW').value = '700'; $('mMediaW').dispatchEvent(new Event('change'));
      $('mMediaH').value = '80'; $('mMediaH').dispatchEvent(new Event('change'));
      w.prompt = () => 'Vinyl strip';
      $('btnMediaSave').click();
      const savedOk = $('mPaper').value === 'size:Vinyl strip' && /Vinyl strip \(700 × 80 mm\)/.test($('mPaper').textContent) &&
        JSON.parse(w.localStorage.getItem('sd10.mediaSizes'))[0].h === 80 && !$('btnMediaRemove').classList.contains('hidden');
      setSel('mPaper', 'a4');
      setSel('mPaper', 'size:Vinyl strip');
      const reselect = $('mMediaW').value === '700' && $('mMediaH').value === '80' && JSON.parse(w.localStorage.getItem('sd10.match')).media === 'size:Vinyl strip';
      $('btnMediaRemove').click();
      log(savedOk && reselect && $('mPaper').value === 'custom' && !/Vinyl strip/.test($('mPaper').textContent), 'a media size can be saved by name, chosen again (and is remembered), and removed');
      $('mMediaW').value = '210'; $('mMediaW').dispatchEvent(new Event('change'));
      $('mMediaH').value = '297'; $('mMediaH').dispatchEvent(new Event('change'));
      const ids = [...d.querySelectorAll('[id]')].map((e) => e.id);
      log(ids.length === new Set(ids).size && $('matchMf').value === '1', 'element ids are unique; match M-factor shows the job default (M1)');
      setSel('mMode', 'cmyk');
      log($('mRipFormat').disabled && $('mLibName').disabled && /CMYK profile/.test($('mModeHelp').textContent), 'CMYK mode turns off the spot library format and name, and explains the profile');
      $('btnConnect').click();
      await until(() => /simulated/.test($('connPill').textContent) && !$('btnMatchTarget').disabled);
      $('demoShutter').click(); await sleep(200);
      $('btnMatchTarget').click();   // shutter closed -> calibrates
      await until(() => /Calibrated/.test($('statusChips').textContent) && !$('btnMatchTarget').disabled);
      $('demoShutter').click(); await sleep(200);

      // Reference: a color the simulated printer can reach (typed in, like a user entering Lab values)
      const target = spectrumToLab(printSpectrum([18, 62, 74, 6]), 0, 2);
      [['mL', 0], ['mA', 1], ['mB', 2]].forEach(([id, i]) => { $(id).value = target[i].toFixed(2); });
      $('mB').dispatchEvent(new Event('change'));
      log(!$('btnMatchSheet').disabled && /#/.test($('mStatusTarget').textContent), `reference set (L*a*b* ${target.map((v) => v.toFixed(1)).join(', ')})`);

      $('btnMatchSheet').click();
      log(await until(() => d.querySelectorAll('#mPatchGrid [data-patch]').length === 16), 'round 1 sheet with 16 patches created (CMYK)');
      $('btnMatchPdf').click();
      log(downloads() === 1, 'PDF download triggered');

      async function scanAll(round) {
        for (let i = 0; i < 16; i++) {
          await until(() => !$('btnMatchMeasure').disabled);
          $('btnMatchMeasure').click();
          await until(() => $('mProgress').textContent.startsWith(`${i + 1} /`) || !$('mResultCard').classList.contains('hidden'));
        }
        return until(() => !$('mResultCard').classList.contains('hidden') && /(predicted|printed) ΔE00/.test($('mResult').textContent));
      }
      log(await scanAll(1), 'round 1 scanned -> result shown');
      const r1 = $('mResult').textContent.replace(/\s+/g, ' ');
      const centre1 = parseFloat(r1.match(/Centre patch\s*ΔE00 ([\d.]+)/)?.[1]);
      log(Number.isFinite(centre1), `round 1 centre patch (profile guess) ΔE00 ${centre1}`);

      $('btnMatchRefine').click();
      log(await until(() => /sheet 2/.test($('mRoundLabel').textContent) && $('mProgress').textContent.startsWith('0 /')), 'refinement sheet (round 2) created');
      log(await scanAll(2), 'round 2 scanned -> result shown');
      const r2 = $('mResult').textContent.replace(/\s+/g, ' ');
      const centre2 = parseFloat(r2.match(/Centre patch\s*ΔE00 ([\d.]+)/)?.[1]);
      log(centre2 < centre1, `round 2 centre patch (round-1 answer) ΔE00 ${centre2} – improved`);
      log(/rough estimate/.test(r1) || /EXPECTED MATCH/.test(r1), 'round 1 flags an extrapolated answer as a rough estimate');
      // refine until the previous round's values print within tolerance (the simulated printer's first guess is
      // ~22 ΔE00 off, and each round's move is capped, so this takes 3–4 rounds)
      let round = 2, rN = r2, centreN = centre2;
      while (!/Done\./.test(rN) && round < 5) {
        round++;
        $('btnMatchRefine').click();
        await until(() => new RegExp(`sheet ${round}`).test($('mRoundLabel').textContent) && $('mProgress').textContent.startsWith('0 /'));
        await scanAll(round);
        rN = $('mResult').textContent.replace(/\s+/g, ' ');
        centreN = parseFloat(rN.match(/Centre patch\s*ΔE00 ([\d.]+)/)?.[1]);
      }
      log(round <= 4 && centreN <= 1, `round ${round} centre patch (round-${round - 1} answer) ΔE00 ${centreN} – within tolerance 1 by round 4`);
      log(/Done\./.test(rN), 'shows "Done" once the previous values print within tolerance');
      log(d.querySelectorAll('#mResult tbody tr').length === round, `round history lists ${round} rounds`);

      // device button measures a patch in this view
      $('btnMatchRefine').click();
      await until(() => new RegExp(`sheet ${round + 1}`).test($('mRoundLabel').textContent));
      w.document.querySelector('[data-view=match]').click();
      $('demoButton').click();
      log(await until(() => $('mProgress').textContent.startsWith('1 /')), 'SD-10 button measures the next patch');

      // ---- several colors in progress at once: each has its own sheet; scanning only affects the selected color
      await until(() => !state_busy());
      setSel('mMode', 'lab'); setSel('mDesign', 'compact'); setSel('mPaper', 'custom'); setSel('mPatchMm', '15');
      $('mMediaW').value = '150'; $('mMediaW').dispatchEvent(new Event('change'));
      $('mMediaH').value = '200'; $('mMediaH').dispatchEvent(new Event('change'));
      const label = () => $('mRoundLabel').textContent;
      await until(() => !$('btnMatchSheet').disabled);
      $('btnMatchSheet').click(); // color 1 (selected)
      await until(() => d.querySelectorAll('#mPatchGrid [data-patch]').length === 8 && /Color 1 – sheet 1/.test(label()));
      for (let i = 0; i < 3; i++) {
        await until(() => !$('btnMatchMeasure').disabled);
        $('btnMatchMeasure').click();
        await until(() => $('mProgress').textContent.startsWith(`${i + 1} /`));
      }
      $('btnColorAdd').click();
      $('mSpotName').value = 'Second'; $('mSpotName').dispatchEvent(new Event('change'));
      const t2 = spectrumToLab(printSpectrum([60, 10, 20, 0]), 0, 2);
      [['mL', 0], ['mA', 1], ['mB', 2]].forEach(([id, i]) => { $(id).value = t2[i].toFixed(2); });
      $('mB').dispatchEvent(new Event('change'));
      log(d.querySelectorAll('#mColorList li[data-color]').length === 2 && /No sheet yet/.test($('mPatchGrid').textContent) && /for Second/.test($('mSheetInfo').textContent) && $('mResultCard').classList.contains('hidden'),
        'a new color starts with its own empty sheet, scan and result');
      await until(() => !$('btnMatchSheet').disabled);
      $('btnMatchSheet').click();
      await until(() => d.querySelectorAll('#mPatchGrid [data-patch]').length === 8 && /Second – sheet 1/.test(label()));
      const nFiles = files.length;
      $('btnMatchPdf').click();
      const colorPdfs = files.slice(nFiles).filter((f) => f.name.endsWith('.pdf'));
      const pdf1 = colorPdfs[0] ? await readFile(colorPdfs[0]) : '';
      log(colorPdfs.length === 1 && colorPdfs[0].name === 'Second - sheet 1.pdf' && /MediaBox \[0 0 425\.20 566\.93\]/.test(pdf1), `the PDF is the selected color's sheet (${colorPdfs.map((f) => f.name).join(', ')}, 150 × 200 mm)`);
      for (let i = 0; i < 8; i++) {
        await until(() => !$('btnMatchMeasure').disabled);
        $('btnMatchMeasure').click();
        await until(() => $('mProgress').textContent.startsWith(`${i + 1} /`));
      }
      await until(() => !$('mResultCard').classList.contains('hidden'));
      const firstRow = d.querySelectorAll('#mColorList li[data-color]')[0].textContent;
      log(/Second/.test($('mResult').textContent) && d.querySelectorAll('#mResult [data-res]').length === 1 && /3\/8 scanned/.test(firstRow),
        `scanning Second left Color 1 where it was (${firstRow.replace(/\s+/g, ' ').trim()})`);
      d.querySelectorAll('#mColorList [data-color-act=select]')[0].click();
      log($('mProgress').textContent.startsWith('3 / 8') && /#4/.test($('btnMatchMeasure').textContent) && /Color 1 – sheet 1/.test(label()) && $('mResultCard').classList.contains('hidden'),
        `selecting Color 1 brings back its sheet and scan position (${$('btnMatchMeasure').textContent})`);
      d.querySelectorAll('#mColorList [data-color-act=select]')[1].click();
      d.querySelector('#mResult [data-res-act=accept]').click();
      log($('btnMatchRefine').disabled && /accepted/.test($('mColorList').textContent), 'an accepted color gets no further sheets');
      d.querySelectorAll('#mColorList [data-color-act=remove]')[1].click();
      setSel('mDesign', 'full'); setSel('mPaper', 'a4'); setSel('mPatchMm', '20');

      // ---- spot color sheet, 3 readings per patch, VersaWorks libraries
      await until(() => !state_busy());
      setSel('mMode', 'spot');
      // measured reference (the simulator's sample): its spectrum enables the metamerism check
      $('btnMatchTarget').click();
      await until(() => /Reference color measured/.test($('toast').textContent) && !state_busy());
      setSel('mReads', '3');
      log($('mRipFormat').value === 'cxf' && /CxF3 format/.test($('btnMatchRipSheet').title), 'CxF3 is the default spot library format');
      setSel('mRipFormat', 'versaworks');
      $('mSpotName').value = 'Brand Red'; $('mSpotName').dispatchEvent(new Event('change'));
      await until(() => !$('btnMatchSheet').disabled);
      $('btnMatchSheet').click();
      await until(() => d.querySelectorAll('#mPatchGrid [data-patch]').length === 16 && /sheet 1/.test($('mRoundLabel').textContent));
      log(/SD10-[A-Z2-9]{4}-R1-01/.test($('mSheetInfo').textContent) && !$('btnMatchRipSheet').classList.contains('hidden'), 'spot sheet: patches get unique spot names, VersaWorks library offered');
      $('btnMatchPdf').click();
      $('btnMatchRipSheet').click();
      const lib = files.find((f) => f.name.endsWith('.spot'));
      const libText = lib ? await readFile(lib) : '';
      const libNames = [...libText.matchAll(/<Lab16SpotColor name="(SD10-[^"]+)"/g)].map((m) => m[1]);
      log(files.filter((f) => f.name.endsWith('.pdf')).pop()?.name === 'Brand Red - sheet 1.pdf' && libNames.length === 16 && libText.startsWith('<?xml version="1.0" encoding="UTF-8"?>\n<SpotColorLibraryList strVersion="4.3.0.0">'), `sheet .spot library has the 16 patch colors (${lib?.name})`);
      for (let i = 0; i < 2; i++) { await until(() => !$('btnMatchMeasure').disabled); $('btnMatchMeasure').click(); await until(() => d.querySelector('[data-patch="0"]').textContent.includes(`${i + 1}/3`)); }
      log($('mProgress').textContent.startsWith('0 /') && /reading 3\/3/.test($('btnMatchMeasure').textContent), 'patch stays open until its 3rd reading');
      for (let n = 0; n < 5 * 3 - 2; n++) { await until(() => !$('btnMatchMeasure').disabled); $('btnMatchMeasure').click(); await until(() => $('btnMatchMeasure').disabled === false && !w.document.querySelector('#btnMatchMeasure').textContent.endsWith('…'), 5000); await sleep(30); }
      await until(() => $('mProgress').textContent.startsWith('5 /'));
      log($('mProgress').textContent.startsWith('5 /'), `15 readings -> 5 patches averaged (${$('mProgress').textContent})`);
      $('btnMatchAnalyse').click();
      await until(() => !$('mResultCard').classList.contains('hidden'));
      log(/named color Brand Red/.test($('mResult').textContent), 'spot result names the color');
      log(/Metamerism check \(best patch #\d+ vs reference\)/.test($('mResult').textContent) && /Tri-band shop light/.test($('mResult').textContent), `metamerism check compares the best patch with the measured reference under other lights (${($('mResult').textContent.match(/Metamerism check.{0,120}/) || [''])[0]})`);
      setSel('matchFormula', 'cmc21');
      log(/(predicted|printed) ΔE CMC 2:1/.test($('mResult').textContent) && /Centre patch\s*ΔE CMC 2:1/.test($('mResult').textContent), 'switching to ΔE CMC 2:1 re-judges the result');
      setSel('matchFormula', 'de00');
      // the Colors card is the spot library: every color under its name with its recommended L*a*b* (its result; its
      // reference until it has one), downloaded as one file
      const job = () => JSON.parse(w.localStorage.getItem('sd10.match'));
      // (the values to use now: a patch that printed within tolerance – the sheet's centre unless another printed clearly
      // closer – else the best measured patch while the result is only a rough estimate beyond the sheet, else the result)
      const useNowX = (c, r) => {
        const res = r.result, tol = job().tol;
        const rr = c.rounds.find((x) => x.round === (res.bestEver?.round ?? r.round));
        const best = rr?.patches.find((q) => q.n === (res.bestEver?.n ?? res.best.n)), bestDE = res.bestEver?.dE ?? res.best.dE;
        const centreOk = res.centreDE != null && res.centreDE <= tol;
        if (centreOk && !(best && res.centreDE - bestDE > Math.max(0.3, res.repeatability ?? 0))) return r.centre;
        if (best && (bestDE <= tol || res.extrapolated)) return best.x;
        return res.x;
      };
      const outputs = () => Object.fromEntries(job().colors.filter((c) => c.target).map((c) => {
        const r = [...c.rounds].reverse().find((x) => x.result);
        return [c.name, (r ? useNowX(c, r) : c.target).map((v) => v.toFixed(2)).join()];
      }));
      const redItem = [...d.querySelectorAll('#mColorList [data-color]')].find((li) => /Brand Red/.test(li.textContent));
      log(/→ .*(result|printed|confirmed) [\d.]+/.test(redItem?.textContent ?? ''), `each color shows the L*a*b* recommended for the RIP (${redItem?.textContent.replace(/\s+/g, ' ').trim().slice(0, 90)})`);
      $('btnLibDownload').click();
      const libFile = files.find((f) => f.name === 'SD-10 spot colors.spot');
      const libSpot = libFile ? await readFile(libFile) : '';
      const spotEntries = Object.fromEntries([...libSpot.matchAll(/<Lab16SpotColor name="([^"]+)" flags="0" redirectLibraryName="" redirectColorName=""><L VALUE="([-\d.]+)"\/><a VALUE="([-\d.]+)"\/><b VALUE="([-\d.]+)"\/>/g)].map((m) => [m[1], [m[2], m[3], m[4]].map(Number).map((v) => v.toFixed(2)).join()]));
      log(JSON.stringify(spotEntries) === JSON.stringify(outputs()) && /LabSpotColorLibrary name="SD-10 spot colors"/.test(libSpot),
        `one VersaWorks .spot file holds every color with its recommended values (${Object.keys(spotEntries).join(', ')})`);
      $('mLibName').value = 'House colors'; $('mLibName').dispatchEvent(new Event('change'));
      setSel('mRipFormat', 'cxf');
      $('btnLibDownload').click();
      const cxfFile = files.find((f) => f.name === 'House colors.cxf');
      const cxfText = cxfFile ? await readFile(cxfFile) : '';
      log(/<cc:Object ObjectType="Standard" Name="Brand Red" Id="EXC_\d+">/.test(cxfText), 'CxF3 library file named after the library');

      // colors from a library file: new names added with the file's L*a*b* as their reference, names already there kept
      const imp = '<?xml version="1.0" encoding="UTF-8"?>\n<SpotColorLibraryList strVersion="4.3.0.0"><LabSpotColorLibrary name="RIP"><m_eMakerType>0</m_eMakerType><m_bUseLibrary>false</m_bUseLibrary>' +
        '<Lab16SpotColor name="Brand Red" flags="0" redirectLibraryName="" redirectColorName=""><L VALUE="20.00"/><a VALUE="5.00"/><b VALUE="-40.00"/></Lab16SpotColor>' +
        '<Lab16SpotColor name="Rounding" flags="0" redirectLibraryName="" redirectColorName=""><L VALUE="50.20"/><a VALUE="10.50"/><b VALUE="-10.50"/></Lab16SpotColor></LabSpotColorLibrary></SpotColorLibraryList>\n';
      const redBefore = job().colors.find((c) => c.name === 'Brand Red').target.join();
      const dt = new w.DataTransfer();
      dt.items.add(new w.File([imp], 'rip-export.spot', { type: 'application/xml' }));
      $('colorsFile').files = dt.files;
      $('colorsFile').dispatchEvent(new w.Event('change'));
      await until(() => job().colors.some((c) => c.name === 'Rounding'));
      log(job().colors.find((c) => c.name === 'Rounding')?.target.join() === '50.2,10.5,-10.5' && job().colors.find((c) => c.name === 'Brand Red').target.join() === redBefore && /1 already in the list/.test($('toast').textContent),
        `a library file adds its new colors and keeps the ones already there (${$('toast').textContent.slice(0, 70)})`);
      // a color without a result yet goes into the file with its reference; Adobe Color Book shows its 8-bit rounding
      setSel('mRipFormat', 'acb');
      await until(() => !/working out/.test($('mLibNote').textContent));
      log(/Adobe Color Book stores L\* in steps of 0\.4/.test($('mLibNote').textContent) && /go in with their reference/.test($('mLibNote').textContent),
        `Adobe Color Book: the export row shows the rounding and the colors without a recommendation (${$('mLibNote').textContent.slice(0, 80)})`);
      $('btnLibDownload').click();
      const acbFile = files.find((f) => f.name === 'House colors.acb');
      const acbBytes = acbFile ? new Uint8Array(await (await fetch(acbFile.href)).arrayBuffer()) : new Uint8Array();
      log(String.fromCharCode(...acbBytes.slice(0, 4)) === '8BCB' && String.fromCharCode(...acbBytes.slice(-8)) === 'spflspot', `.acb library downloaded (${acbBytes.length} bytes)`);
      setSel('mRipFormat', 'cxf');
      // drag & drop a CxF in Digital Factory's form (BOM, cc: prefix, CRLF) onto the page; the page highlights while dragging
      const dfCxf = '﻿<?xml version="1.0" encoding="UTF-8"?>\r\n<cc:CxF xmlns:cc="http://colorexchangeformat.com/CxF3-core">\r\n  <cc:Resources>\r\n    <cc:ObjectCollection>\r\n' +
        '      <cc:Object ObjectType="Standard" Name="Dropped" Id="EXC_1">\r\n        <cc:ColorValues>\r\n          <cc:ColorCIELab ColorSpecification="CS0">\r\n' +
        '            <cc:L>42</cc:L>\r\n            <cc:A>0</cc:A>\r\n            <cc:B>69</cc:B>\r\n          </cc:ColorCIELab>\r\n        </cc:ColorValues>\r\n      </cc:Object>\r\n' +
        '    </cc:ObjectCollection>\r\n    <cc:ColorSpecificationCollection>\r\n      <cc:ColorSpecification Id="CS0">\r\n        <cc:TristimulusSpec>\r\n' +
        '          <cc:Illuminant>D50</cc:Illuminant>\r\n          <cc:Observer>2_Degree</cc:Observer>\r\n        </cc:TristimulusSpec>\r\n      </cc:ColorSpecification>\r\n' +
        '    </cc:ColorSpecificationCollection>\r\n  </cc:Resources>\r\n</cc:CxF>';
      const ddt = new w.DataTransfer();
      ddt.items.add(new w.File([dfCxf], 'Digital Factory.cxf', { type: 'application/xml' }));
      const dropOn = $('mResult');
      dropOn.dispatchEvent(new w.DragEvent('dragenter', { bubbles: true, dataTransfer: ddt }));
      const lit = $('viewMatch').classList.contains('outline-dashed');
      const over = new w.DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer: ddt });
      dropOn.dispatchEvent(over);
      dropOn.dispatchEvent(new w.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: ddt }));
      await until(() => job().colors.some((c) => c.name === 'Dropped'));
      log(lit && over.defaultPrevented && !$('viewMatch').classList.contains('outline-dashed') && job().colors.find((c) => c.name === 'Dropped')?.target.join() === '42,0,69', 'a CxF file dropped on the page adds its colors (Digital Factory form)');
      // the imported colors go again, and Brand Red is selected for what follows
      w.confirm = () => true;
      for (const name of ['Rounding', 'Dropped']) {
        const li = [...d.querySelectorAll('#mColorList [data-color]')].find((x) => x.textContent.includes(name));
        li?.querySelector('[data-color-act=remove]')?.click();
      }
      [...d.querySelectorAll('#mColorList [data-color]')].find((x) => /Brand Red/.test(x.textContent))?.querySelector('[data-color-act=select]').click();
      log(job().colors.every((c) => !['Rounding', 'Dropped'].includes(c.name)) && $('mSpotName').value === 'Brand Red', 'imported colors can be removed again');

      // an output set by hand: paper white in CMYK – into Edge Print libraries and onto the proof sheet; formats that hold
      // L*a*b* only leave it out (and say so); "Use the recommendation again" clears it
      const brandRed = () => job().colors.find((c) => c.name === 'Brand Red');
      $('btnFixedSet').click();
      d.querySelector('[data-fixed-preset=paper]').click();
      $('btnFixedSave').click();
      log(brandRed().fixed?.space === 'cmyk' && brandRed().fixed.v.join() === '0,0,0,0' && /C0\.0 M0\.0 Y0\.0 K0\.0.*set by hand/.test($('mFixedText').textContent) &&
        /set by hand/.test([...d.querySelectorAll('#mColorList [data-color]')].find((li) => /Brand Red/.test(li.textContent))?.textContent ?? ''),
        'an output can be set by hand (paper white, CMYK 0 0 0 0) – the Reference card and the color list show it');
      setSel('mRipFormat', 'epcc');
      $('btnLibDownload').click();
      const epccFile = files.find((f) => f.name === 'House colors.epcc');
      const epccText = epccFile ? new TextDecoder('utf-16le').decode(new Uint8Array(await (await fetch(epccFile.href)).arrayBuffer()).subarray(2)) : '';
      log(/\r\n0,9,Brand Red,1,4,0;0;0;0\r\n/.test(epccText), 'an Edge Print library takes the CMYK set by hand');
      setSel('mRipFormat', 'versaworks');
      log(/set by hand in CMYK stays out of VersaWorks \.spot libraries/.test($('mLibNote').textContent), `a library format without CMYK leaves it out and says so (${$('mLibNote').textContent.slice(0, 80)})`);
      $('btnLibProof').click();
      const proofFile = files.find((f) => f.name === 'House colors - proof.pdf');
      const proofText = proofFile ? await readFile(proofFile) : '';
      log(proofText.includes('/Separation /Brand#20Red /DeviceCMYK') && /^%PDF-1\.4/.test(proofText), 'the proof sheet holds every color as a named spot color – the one set by hand in CMYK');
      $('btnFixedSet').click();
      $('btnFixedClear').click();
      log(!brandRed().fixed && /the recommendation/.test($('mFixedText').textContent), '"Use the recommendation again" clears the output set by hand');
      // a color can be left out of the spot library and the proof sheet (the box in its row), and taken back in
      $('btnColorAdd').click();
      $('mSpotName').value = 'Kept Green'; $('mSpotName').dispatchEvent(new Event('change'));
      [['mL', 50], ['mA', -40], ['mB', 20]].forEach(([id, v]) => { $(id).value = String(v); });
      $('mB').dispatchEvent(new Event('change'));
      const row = (name) => [...d.querySelectorAll('#mColorList [data-color]')].find((li) => li.textContent.includes(name));
      row('Brand Red').querySelector('[data-color-act=library]').click();
      setSel('mRipFormat', 'cxf');
      log(brandRed().noLibrary === true && /left out of the spot library/.test(row('Brand Red').textContent) && /1 left out/.test($('mLibNote').textContent),
        `a color can be left out of the library (${$('mLibNote').textContent.slice(0, 60)})`);
      const filesBefore = files.length;
      $('btnLibDownload').click();
      $('btnLibProof').click();
      const cxfOut = files.slice(filesBefore).find((f) => f.name === 'House colors.cxf'), proofOut = files.slice(filesBefore).find((f) => f.name === 'House colors - proof.pdf');
      const keptCxf = cxfOut ? await readFile(cxfOut) : '', keptProof = proofOut ? await readFile(proofOut) : '';
      log(/Name="Kept Green"/.test(keptCxf) && !/Name="Brand Red"/.test(keptCxf) && keptProof.includes('/Kept#20Green') && !keptProof.includes('/Brand#20Red'),
        'a color left out is in neither the library file nor the proof sheet');
      row('Brand Red').querySelector('[data-color-act=library]').click();
      log(!brandRed().noLibrary && $('mSpotName').value === 'Kept Green', 'ticking it again takes it back in (the box does not change the selected color)');
      w.confirm = () => true;
      row('Kept Green').querySelector('[data-color-act=remove]').click();
      row('Brand Red').querySelector('[data-color-act=select]').click();
      setSel('mRipFormat', 'cxf');

      // ---- RGB / raster sheet
      setSel('mMode', 'rgb');
      await until(() => !$('btnMatchSheet').disabled);
      $('btnMatchSheet').click();
      await until(() => d.querySelectorAll('#mPatchGrid [data-patch]').length === 16 && /sheet 1/.test($('mRoundLabel').textContent));
      log($('btnMatchPdf').textContent === 'Download PNG' && /R \d+\s+G \d+\s+B \d+/.test($('mSheetInfo').textContent), 'RGB sheet offers a PNG and shows integer RGB values');
      $('btnMatchPdf').click();
      const pngFile = await until(() => files.some((f) => f.name.endsWith('.png'))) && files.find((f) => f.name.endsWith('.png'));
      const pngBytes = pngFile ? new Uint8Array(await (await fetch(pngFile.href)).arrayBuffer()) : new Uint8Array();
      log(pngBytes[1] === 0x50 && pngBytes.length > 100000, `PNG sheet downloaded (${pngFile?.name}, ${pngBytes.length} bytes)`);
      setSel('mReads', '1');

      // ---- printer profile: gamut check
      const iccBuf = await (await fetch('../icc/USWebCoatedSWOP.icc')).arrayBuffer();
      const dt2 = new w.DataTransfer();
      dt2.items.add(new w.File([iccBuf], 'press.icc', { type: 'application/vnd.iccprofile' }));
      $('printerIccFile').files = dt2.files;
      $('printerIccFile').dispatchEvent(new w.Event('change'));
      await until(() => $('mPrinterProfile').value !== '');
      [['mL', 50], ['mA', 90], ['mB', -100]].forEach(([id, v]) => { $(id).value = String(v); });
      $('mB').dispatchEvent(new Event('change'));
      await until(() => /Outside the printer gamut/.test($('mGamut').textContent));
      log(/Outside the printer gamut/.test($('mGamut').textContent) && /OUT OF GAMUT/.test($('mColorList').textContent), `printer profile flags an unprintable reference (${$('mGamut').textContent.slice(0, 90)}…)`);
      [['mL', 60], ['mA', 10], ['mB', 20]].forEach(([id, v]) => { $(id).value = String(v); });
      $('mB').dispatchEvent(new Event('change'));
      await until(() => /Inside the printer gamut/.test($('mGamut').textContent));
      log(/Inside the printer gamut/.test($('mGamut').textContent), 'a printable reference is reported inside the gamut');

      // colors to match from an Adobe Swatch Exchange file: one color per L*a*b* swatch, names as in the artwork
      {
        const be = (n, v) => { const out = []; for (let i = n - 1; i >= 0; i--) out.push((v >>> (8 * i)) & 255); return out; };
        const f32 = (v) => { const dv = new DataView(new ArrayBuffer(4)); dv.setFloat32(0, v); return [...new Uint8Array(dv.buffer)]; };
        const swatch = (t, lab) => {
          const z = t + '\0';
          const body = [...be(2, z.length), ...[...z].flatMap((ch) => be(2, ch.charCodeAt(0))), ...[...'LAB '].map((c) => c.charCodeAt(0)), ...lab.flatMap(f32), ...be(2, 1)];
          return [...be(2, 1), ...be(4, body.length), ...body];
        };
        const bytes = [...[...'ASEF'].map((c) => c.charCodeAt(0)), ...be(2, 1), ...be(2, 0), ...be(4, 2),
          ...swatch('Swatch Teal', [0.456, -41, -16]), ...swatch('Swatch Gold', [0.7638, 20.16, 75.13])];
        const job = () => JSON.parse(w.localStorage.getItem('sd10.match'));
        const before = job().colors.length;
        const adt = new w.DataTransfer();
        adt.items.add(new w.File([new Uint8Array(bytes)], 'artwork.ase', { type: 'application/octet-stream' }));
        $('colorsFile').files = adt.files;
        $('colorsFile').dispatchEvent(new w.Event('change'));
        await until(() => job().colors.length === before + 2);
        const teal = job().colors.find((c) => c.name === 'Swatch Teal');
        log(teal?.target.join() === '45.6,-41,-16' && job().colors.some((c) => c.name === 'Swatch Gold') && /Swatch Teal/.test($('mColorList').textContent) && /2 colors added/.test($('toast').textContent),
          `colors to match import from an Adobe Swatch Exchange file (${$('toast').textContent.slice(0, 60)})`);
      }

      // switching views keeps the connection
      d.querySelector('[data-view=console]').click();
      log(!$('viewConsole').classList.contains('hidden') && /simulated/.test($('connPill').textContent), 'switch to Console keeps the device connected');
      // debug report: one file with the journal, the screen, stored data, device and browser
      d.querySelector('[data-view=match]').click();
      w.prompt = () => 'Result looked wrong';
      const nReports = files.length;
      $('btnDebugReport').click();
      await until(() => files.length > nReports);
      const repFile = files.slice(nReports).find((f) => /^sd10-debug-\d{8}-\d{4}\.json$/.test(f.name));
      const rep = repFile ? JSON.parse(await readFile(repFile)) : {};
      const kinds = new Set((rep.journal ?? []).map((e) => e.kind));
      const measured = (rep.journal ?? []).find((e) => e.kind === 'measure');
      const repChecks = { format: rep.format === 'sd10-debug-report', note: rep.note === 'Result looked wrong', version: /^\d{4}-\d{2}-\d{2}/.test(rep.app?.version ?? ''), device: !!(rep.app?.connected && rep.app.device?.model),
        protocol: rep.app?.protocolLog?.length > 50, kinds: ['start', 'click', 'change', 'toast', 'task', 'match', 'measure', 'result'].every((k) => kinds.has(k)), measure: measured?.data?.lab?.length === 3,
        storage: !!(rep.storage?.['sd10.match']?.colors?.length >= 1 && !rep.storage['sd10.debugJournal']),
        screen: rep.screen?.view === 'viewMatch' && rep.screen.cards.some((c) => /Settings/.test(c.title)), browser: !!rep.browser?.userAgent };
      log(Object.values(repChecks).every(Boolean) && rep.format === 'sd10-debug-report' && rep.note === 'Result looked wrong' && /^\d{4}-\d{2}-\d{2}/.test(rep.app?.version ?? '') && rep.app.connected && rep.app.device?.model &&
        rep.app.protocolLog?.length > 50 && ['start', 'click', 'change', 'toast', 'task', 'match', 'measure', 'result'].every((k) => kinds.has(k)) && measured?.data?.lab?.length === 3 &&
        rep.storage['sd10.match']?.colors?.length >= 1 && !rep.storage['sd10.debugJournal'] &&
        rep.screen?.view === 'viewMatch' && rep.screen.cards.some((c) => /Settings/.test(c.title)) && rep.browser?.userAgent,
        `debug report saved ${Object.entries(repChecks).filter(([, v]) => !v).map(([k]) => 'MISSING ' + k).join(' ')}(${repFile?.name}: ${rep.journal?.length} journal entries – ${[...kinds].join(', ')}; ${rep.screen?.cards?.length} cards of screen text)`);
      log(errors.length === 0, `no JS errors ${errors.join(' | ')}`);
      const pass = lines.filter((l) => l.startsWith('PASS')).length;
      out.textContent += `\n${pass}/${lines.length}`;
      document.title = pass === lines.length ? 'ALL PASS' : 'FAILURES';
    };
  </script>
</body>
</html>
